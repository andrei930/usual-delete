name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Test learning and storage
        run: npm test
      - name: Install Chromium for extension tests
        run: npx playwright install --with-deps chromium
      - name: Test the unpacked extension
        run: npm run test:browser
        env:
          PREVIEW_PATH: ${{ runner.temp }}/usual-delete-preview.png
